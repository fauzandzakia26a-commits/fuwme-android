name: Build FUWME Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Install Bun Package Manager
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Build Android APK
      run: |
        # Cari lokasi package.json secara otomatis
        TARGET_DIR=$(dirname $(find . -name package.json -not -path "*/node_modules/*" | head -n 1))
        echo "Project terdeteksi di folder: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        # Eksekusi instalasi dan sinkronisasi Capacitor
        bun install
        bun run build --if-present
        bunx cap sync android
        
        # Masuk ke folder android untuk merakit APK
        chmod +x android/gradlew
        cd android
        ./gradlew assembleRelease
        
        # Ambil file APK hasil rakitan
        mkdir -p ../../output-apk
        cp app/build/outputs/apk/release/app-release-unsigned.apk ../../output-apk/FUWME.apk

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FUWME-Android-APK
        path: output-apk/FUWME.apk

